version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: flowers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ../backend
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"

  bot:
    build: ../bot
    env_file: .env
    depends_on:
      - backend

  miniapp:
    build: ../miniapp
    ports:
      - "5173:5173"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - miniapp

volumes:
  db_data:
